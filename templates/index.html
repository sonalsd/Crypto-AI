<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRYPTO INTELLIGENCE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: rgba(30, 35, 41, 0.95);
            --text-gray: #848e9c;
            --accent: #f0b90b;
        }

        body {
            background: linear-gradient(rgba(11, 14, 17, 0.85), rgba(11, 14, 17, 0.85)), url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpvqVUQ8yDrVk1ynvRj0BdFpBnKYDwzSRLWw&s');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hero Centered Search */
        .hero-container {
            width: 100%;
            max-width: 700px;
            padding-top: 15vh;
            text-align: center;
        }

        .search-wrapper {
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-gold {
            background-color: var(--accent);
            color: black;
            font-weight: bold;
            border: none;
            padding: 10px 25px;
        }

        /* Dynamic Results Area */
        #results-area {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin-top: 40px;
            padding-bottom: 50px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            height: 100%;
        }

        #mainChart {
            height: 350px !important;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1 class="fw-bold mb-4">CRYPTO<span style="color:var(--accent)"> INTELLIGENCE</span></h1>
        <div class="search-wrapper">
            <div class="input-group input-group-lg">
                <input type="text" id="coinInput" class="form-control bg-transparent text-white border-0"
                       placeholder="Search BTC, ETH, SOL..." onkeypress="if(event.key==='Enter') startAnalysis()">
                <button class="btn btn-gold rounded-3" onclick="startAnalysis()">ANALYZE</button>
            </div>
        </div>
    </div>

    <div class="container-fluid" id="results-area">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <h6 class="text-gray small">LIVE PRICE</h6>
                    <h2 id="assetDisplay" class="fw-bold">---/USDT</h2>
                    <h3 id="livePrice" class="text-success">$0.00</h3>
                    <hr style="opacity: 0.1">
                    <div class="text-center p-3 rounded" style="background: rgba(255,255,255,0.03)">
                        <small class="text-gray">We Recommend You to-</small>
                        <h4 id="signalText" class="fw-bold mb-0">---</h4>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="stat-card">
                    <h6 class="mb-3">PRICE PROJECTION</h6>
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <h6>MARKET CONTEXT 30 Days</h6>
                    <div class="d-flex justify-content-between my-3">
                        <span class="text-gray small">High:</span>
                        <span id="high30" class="fw-bold text-success">--</span>
                    </div>
                    <div class="d-flex justify-content-between my-3">
                        <span class="text-gray small">Low:</span>
                        <span id="low30" class="fw-bold text-danger">--</span>
                    </div>
                    <div class="d-flex justify-content-between my-3">
                        <span class="text-gray small">Volatility:</span>
                        <span id="vola" class="fw-bold text-warning">--</span>
                    </div>
                    <hr style="opacity: 0.1">
                    <h6>SYSTEM HEALTH</h6>
                    <div class="small mt-2">
                        <div class="d-flex justify-content-between"><span>Robustness:</span> <span id="rob" class="text-info">--</span></div>
                        <div class="d-flex justify-content-between"><span>Model Drift:</span> <span id="drift" class="text-warning">--</span></div>
                        <!--<div class="d-flex justify-content-between"><span>Sucess Rate:</span> <span id="accuracy" class="text-success">--</span></!--div>
                        <!--<div class="d-flex justify-content-between"><span>F1 Prediction:</span> <span id="f1" class="text-info">--</span></div>-->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chart;

        async function startAnalysis() {
            const coin = document.getElementById('coinInput').value;
            if (!coin) return;

            const response = await fetch(`/analyze/${coin}`);
            const data = await response.json();
            if (data.error) return alert(data.error);

            // Populate and Reveal
            document.getElementById('results-area').style.display = 'block';
            document.getElementById('assetDisplay').innerText = data.asset + "/USDT";
            document.getElementById('livePrice').innerText = "$" + data.real_time.binance_price.toLocaleString();
            document.getElementById('signalText').innerText = data.intelligence.signal;

            // 30Days Stats update: historical data
            document.getElementById('high30').innerText = "$" + data.historical_stats['30d_high'].toLocaleString();
            document.getElementById('low30').innerText = "$" + data.historical_stats['30d_low'].toLocaleString();
            document.getElementById('vola').innerText = data.historical_stats.volatility_index;
            document.getElementById('rob').innerText = data.intelligence.robustness;
            document.getElementById('drift').innerText = data.intelligence.drift_score;
            // document.getElementById('accuracy').innerText = data.intelligence.accuracy;
            // document.getElementById('f1').innerText = data.intelligence.f1_score;

            updateChart(data.real_time.binance_price, data.intelligence.prediction);
        }

        function updateChart(curr, pred) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Past', 'Live', 'Target'],
                    datasets: [{
                        label: 'USD Price',
                        data: [curr * 0.99, curr, pred],
                        borderColor: '#f0b90b',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(240, 185, 11, 0.1)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
